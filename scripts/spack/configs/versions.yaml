# Globally lock version of third party libraries
packages:
  axom:
    require:
    - spec: "@0.15.0.1"
  adiak:
    require:
    - spec: "@0.4.1"
  caliper:
    require:
    - spec: "@2.15.0"
  camp:
    require:
    - spec: "@2026.07.2"
  conduit:
    require:
    - spec: "@0.9.6"
  # Hypre v3 causes equationsolver to fail TOSS 4
  hypre:
    require:
    - spec: "@2.33.0"
  mfem:
    require:
    - spec: "@4.10.0.2"
  petsc:
    require:
    - spec: "@3.23.7"
  raja:
    require:
    - spec: "@2026.07.1"
  sundials:
    require:
    - spec: "@7.9.0"
  umpire:
    require:
    - spec: "@2026.07.2"
