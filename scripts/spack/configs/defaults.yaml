# Set directory structures in places we can find easily
config:
  install_tree:
    root: $spack/..
    projections:
      all: '{compiler.name}-{compiler.version}/{name}-{version}-{hash}'
  misc_cache: $spack/../misc_cache
  test_stage: $spack/../test_stage
  build_stage::
  - $spack/../build_stage

# Regular TPLs do not need views
view: false

# Do not allow Spack to flip compiler families
concretizer:
  compiler_mixing: false

# Globally lock variants of third party libraries
packages:
  caliper:
    require:
    - spec: "~kokkos"
  conduit:
    require:
    - spec: "~shared~test~examples~utilities"
  hdf5:
    require:
    - spec: "~shared~mpi"
  mfem:
    require:
    - spec: "cxxstd=17"
  raja:
    require:
    - spec: "~shared~examples~exercises"
  tribol:
    require:
    - spec: "~examples~tests"
  umpire:
    require:
    - spec: "~shared~examples~werror"

  # Forward debug and shared variants to relevant tpls (listed in alphabetical order)
  # NOTE: You can use build_type==Debug and ++shared to propagate variants instead, but it will affect external packages
  # as well and therefore leads to lower chances of concretization
  smith:
    require:
    - spec: "^axom build_type=Debug ^conduit build_type=Debug ^hdf5 build_type=Debug ^hypre+debug ^metis build_type=Debug ^mfem+debug ^parmetis build_type=Debug ^raja build_type=Debug ^strumpack build_type=Debug ^superlu-dist build_type=Debug ^umpire build_type=Debug"
      when: "build_type=Debug"
    - spec: "^tribol build_type=Debug"
      when: "+tribol build_type=Debug"
    - spec: "^axom+shared ^hdf5+shared ^hypre+shared ^metis+shared ^mfem+shared~static ^netcdf-c+shared ^parmetis+shared ^raja+shared ^strumpack+shared ^superlu-dist+shared ^umpire+shared"
      when: "+shared"
