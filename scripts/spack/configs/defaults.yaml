# Set directory structures in places we can find easily
config:
  install_tree:
    root: $spack/..
    projections:
      all: '{compiler.name}-{compiler.version}/{name}-{version}-{hash}'
  misc_cache: $spack/../misc_cache
  test_stage: $spack/../test_stage
  build_stage::
  - $spack/../build_stage

# Regular TPLs do not need views
view: false

# Do not allow Spack to flip compiler families
concretizer:
  compiler_mixing: false

# Globally lock variants of third party libraries
packages:
  caliper:
    require:
    - spec: "~kokkos+shared"
  conduit:
    require:
    - spec: "~shared~test~examples~utilities"
  hdf5:
    require:
    - spec: "~shared~mpi"
  mfem:
    require:
    - spec: "cxxstd=17"
  petsc:
    require:
    - spec: "+shared"
  raja:
    require:
    - spec: "~shared~examples~exercises"
  tribol:
    require:
    - spec: "~examples~tests"
  umpire:
    require:
    - spec: "~shared~examples~werror"

  # Forward debug and shared variants to relevant tpls
  # NOTE: You can use build_type==Debug and ++shared to propagate variants from the smith spec instead, but it will affect external packages
  # as well and therefore leads to lower chances of concretization
  smith:
    require:
    #######
    # Debug
    #######
    # Required dependencies
    - spec: "^axom build_type=Debug ^conduit build_type=Debug ^hdf5 build_type=Debug ^hypre+debug ^metis build_type=Debug ^mfem+debug ^parmetis build_type=Debug ^superlu-dist build_type=Debug"
      when: "build_type=Debug"
    # Optional dependencies
    - spec: "^tribol build_type=Debug"
      when: "+tribol build_type=Debug"
    - spec: "^petsc+debug"
      when: "+petsc build_type=Debug"
    - spec: "^strumpack build_type=Debug"
      when: "+strumpack build_type=Debug"
    - spec: "^raja build_type=Debug"
      when: "+raja build_type=Debug"
    - spec: "^umpire build_type=Debug"
      when: "+umpire build_type=Debug"
    - spec: "^sundials build_type=Debug"
      when: "+sundials build_type=Debug"
    - spec: "^caliper build_type=Debug"
      when: "+caliper build_type=Debug"
    - spec: "^adiak build_type=Debug"
      when: "+adiak build_type=Debug"
    ########
    # Shared
    ########
    # Required dependencies
    - spec: "^axom+shared ^hypre+shared ^metis+shared ^mfem+shared~static ^netcdf-c+shared ^parmetis+shared ^superlu-dist+shared"
      when: "+shared"
    # Optional dependencies
    - spec: "^strumpack+shared"
      when: "+shared+strumpack"
    - spec: "^raja+shared"
      when: "+shared+raja"
    - spec: "^umpire+shared"
      when: "+shared+umpire"
    - spec: "^adiak+shared"
      when: "+shared+adiak"
    - spec: "^sundials+shared"
      when: "+shared+sundials"
    ########
    # Static
    ########
    # Required dependencies
    - spec: "^axom~shared ^hypre~shared ^metis~shared ^mfem~shared+static ^netcdf-c~shared ^parmetis~shared ^superlu-dist~shared"
      when: "~shared"
    # Optional dependencies
    - spec: "^raja~shared"
      when: "~shared+raja"
    - spec: "^umpire~shared"
      when: "~shared+umpire"
    - spec: "^adiak~shared"
      when: "~shared+adiak"
    - spec: "^sundials~shared"
      when: "~shared+sundials"
