spack:
  include:
    - ../defaults.yaml
    - ../versions.yaml


  toolchains:
    clang_19:
    - spec: '%c=llvm@19'
      when: '%c'
    - spec: '%cxx=llvm@19'
      when: '%cxx'
    - spec: '%fortran=gcc@16'
      when: '%fortran'
    - spec: '%openmpi@5.0.10.clang_19'
      when: '%mpi'


  packages:
    all:
      target: [aarch64]
      providers:
        blas: [openblas]
        lapack: [netlib-lapack]
        mpi: [openmpi]
        zlib-api: [zlib]

    #Compiler packages
    gcc:
      externals:
      - spec: gcc@16.2.0 languages:=c,c++,fortran
        prefix: /opt/homebrew/opt/gcc@16
        extra_attributes:
          compilers:
            c: /opt/homebrew/opt/gcc@16/bin/gcc-16
            cxx: /opt/homebrew/opt/gcc@16/bin/g++-16
            fortran: /opt/homebrew/opt/gcc@16/bin/gfortran
    llvm:
      externals:
      - spec: llvm@19.1.7+clang~lld~lldb
        prefix: /opt/homebrew/opt/llvm@19
        extra_attributes:
          compilers:
            c: /opt/homebrew/opt/llvm@19/bin/clang
            cxx: /opt/homebrew/opt/llvm@19/bin/clang++
          flags:
            fflags: -fPIC

    # Providers
    mpi:
      buildable: false
    openmpi:
      buildable: false
      externals:
      - spec: openmpi@5.0.10.clang_19
        prefix: /opt/homebrew
    openblas:
      buildable: false
      externals:
      - spec: openblas@0.3.34
        prefix: /opt/homebrew
    netlib-lapack:
      buildable: false
      externals:
      - spec: netlib-lapack@3.12.1
        prefix: /opt/homebrew/opt/lapack
    zlib:
      buildable: false
      externals:
      - spec: zlib@1.3.1
        prefix: /opt/homebrew/opt/zlib

    # External packages from Homebrew
    automake:
      buildable: false
      externals:
      - spec: automake@1.17
        prefix: /opt/homebrew
    bzip2:
      buildable: false
      externals:
      - spec: bzip2@1.0.8
        prefix: /opt/homebrew/opt/bzip2
    cmake:
      version: [4.4.2]
      buildable: false
      externals:
      - spec: cmake@4.4.2
